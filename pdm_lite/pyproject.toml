[project]
name = "pdm-lite"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "carla (==0.9.15)",
    "webcolors (>=24.11.1,<25.0.0)",
    "ujson (>=5.10.0,<6.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "rdp (>=0.8,<0.9)",
    "h5py (>=3.13.0,<4.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "gym (==0.26.2)",
    "laspy[laszip,lazrs] (>=2.5.4,<3.0.0)",
    "dictor (>=0.1.12,<0.2.0)",
    "requests (>=2.32.3,<3.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "pexpect (>=4.9.0,<5.0.0)",
    "transforms3d (>=0.4.2,<0.5.0)",
    "py-trees (==0.8.3)",
    "numpy (>=2.2.5,<3.0.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "shapely (>=2.1.0,<3.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "xmlschema (>=4.0.1,<5.0.0)",
    "ephem (>=4.2,<5.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "six (>=1.17.0,<2.0.0)",
    "simple-watchdog-timer (>=0.1.1,<0.2.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "torch==2.5.0"
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch_cpu"}
torchvision = {source = "pytorch_cpu"}
torchaudio = {source = "pytorch_cpu"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
